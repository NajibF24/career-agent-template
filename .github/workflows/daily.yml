name: daily job scan

on:
  schedule:
    - cron: "0 1 * * *"   # 08:00 WIB every day
  workflow_dispatch:

permissions:
  contents: write

concurrency: daily-scan

jobs:
  scan:
    if: github.repository != 'NajibF24/career-agent-template'   # the template itself has no secrets and must not collect jobs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run daily
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      - name: commit results
        run: |
          git config user.name "career-agent"
          git config user.email "career-agent@users.noreply.github.com"
          mkdir -p applications   # absent until the first draft is written
          git add data applications
          git diff --cached --quiet || git commit -m "scan $(date -u +%F)"
          git push
